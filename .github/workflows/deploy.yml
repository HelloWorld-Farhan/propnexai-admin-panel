name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3


      - name: Install and Build
        run: |
          npm install
          npx prisma generate
          npm run build

      - name: Copy Files to Server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          source: ".next,public,package.json,package-lock.json,prisma"
          target: "/root/propnexai-admin-panel"

      - name: Restart PM2 on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: root
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /root/propnexai-admin-panel
            npm install --production
            pm2 restart propnexai-admin --update-env || pm2 start npm --name propnexai-admin -- run start
